
name: Android Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            libdbus-1-dev \
            libudev-dev \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          key: cache-build-android-${{ runner.os }}-${{ hashFiles('**/haxelib.json', 'project.xml', 'project/Project.xml') }}
          restore-keys: |
            cache-build-android-${{ runner.os }}-
          path: |
            ~/.gradle
            ~/.haxelib/
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/

      - name: Install CNE libraries
        run: |
          set -euo pipefail
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Select CNE library versions
        run: |
          set -euo pipefail

          haxelib set lime git
          haxelib set hxcpp git
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flixel-animate git
          haxelib set hxdiscord_rpc git

      - name: Initialize Lime submodules
        run: |
          set -euo pipefail

          LIME_DIR=".haxelib/lime/git"

          if [ ! -d "$LIME_DIR/.git" ]; then
            echo "::error::CNE Lime Git directory not found: $LIME_DIR"
            exit 1
          fi

          git -C "$LIME_DIR" submodule sync --recursive
          git -C "$LIME_DIR" submodule update --init --recursive

          test -f "$LIME_DIR/project/lib/imgui/imgui.h"
          test -f "$LIME_DIR/project/lib/imgui/imgui_internal.h"

      - name: Restore Lime native library
        shell: bash
        run: |
          set -euo pipefail

          LIME_DIR=".haxelib/lime/git"
          TARGET_NDLL="$LIME_DIR/ndll"

          # Lime installed from Git does not include lime.ndll.
          # Install the Haxelib release to obtain the native tools.
          haxelib install lime

          # Re-select the CNE fork after installing the release.
          haxelib set lime git

          HAXELIB_REPO="$(haxelib config)"
          LIME_NDLL=""

          for ROOT in "$HAXELIB_REPO" ".haxelib" "$HOME/.haxelib"; do
            [ -d "$ROOT/lime" ] || continue

            LIME_NDLL="$(
              find "$ROOT/lime" \
                -type f \
                -name lime.ndll \
                ! -path '*/git/*' \
                -print -quit 2>/dev/null || true
            )"

            if [ -n "$LIME_NDLL" ]; then
              break
            fi
          done

          if [ -z "$LIME_NDLL" ]; then
            echo "::error::Could not find lime.ndll in the installed Haxelib release."
            echo "Searching for available Lime native libraries:"
            find "$HAXELIB_REPO" -type f -name lime.ndll -print || true
            exit 1
          fi

          SOURCE_NDLL="$(dirname "$(dirname "$LIME_NDLL")")"

          echo "Native library source: $SOURCE_NDLL"
          echo "CNE Lime target: $TARGET_NDLL"

          mkdir -p "$TARGET_NDLL"
          cp -a "$SOURCE_NDLL/." "$TARGET_NDLL/"

          echo "=== Verify copied native libraries ==="
          find "$TARGET_NDLL" -type f -name lime.ndll -print

          if [ ! -f "$TARGET_NDLL/Linux64/lime.ndll" ] &&
             [ ! -f "$TARGET_NDLL/Linux/lime.ndll" ]; then
            echo "::error::lime.ndll was not copied to the expected Linux directory."
            exit 1
          fi

      - name: Install Android tools extension
        run: |
          set -euo pipefail
          haxelib install extension-androidtools 2.2.2

      - name: Enable Android tools extension
        shell: python
        run: |
          from pathlib import Path

          path = Path("project.xml")

          if not path.exists():
              raise SystemExit("project.xml was not found.")

          content = path.read_text(encoding="utf-8")
          dependency = '<haxelib name="extension-androidtools" if="android"/>'

          if dependency not in content:
              anchor = '<haxelib name="flixel-animate"'
              position = content.find(anchor)

              if position == -1:
                  raise SystemExit(
                      "Could not find flixel-animate in project.xml. "
                      "Add the Android tools dependency manually."
                  )

              end = content.find("\n", position)

              if end == -1:
                  content += "\n" + dependency + "\n"
              else:
                  content = (
                      content[:end + 1]
                      + "    "
                      + dependency
                      + "\n"
                      + content[end + 1:]
                  )

              path.write_text(content, encoding="utf-8")

          print("Android tools dependency is configured.")

      - name: Diagnose build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Haxe ==="
          haxe --version

          echo "=== Java ==="
          java -version

          echo "=== Android SDK ==="
          echo "${ANDROID_HOME:-not set}"

          echo "=== Android NDK ==="
          echo "${ANDROID_NDK_HOME:-not set}"

          echo "=== Haxelib packages ==="
          haxelib list

          echo "=== D-Bus header ==="
          test -f /usr/include/dbus-1.0/dbus/dbus.h

          echo "=== Lime native library ==="
          find .haxelib/lime/git/ndll \
            -type f -name lime.ndll -print

          echo "=== ImGui headers ==="
          test -f .haxelib/lime/git/project/lib/imgui/imgui.h
          test -f .haxelib/lime/git/project/lib/imgui/imgui_internal.h

      - name: Configure Android
        shell: bash
        run: |
          set -euo pipefail

          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          haxelib run lime build android -final -D ONLY_ARM64

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find export/release/android \
            -type f -name '*.apk' -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "::error::Build finished but no APK was found."
            echo "Searching for build outputs:"
            find export -type f \( -name '*.apk' -o -name '*.aab' \) -print || true
            exit 1
          fi

          echo "Found APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Codename-Engine-Android
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
